name: destino_plus
description: "Aplicación móvil para la planificación y organización de viajes personales."
publish_to: 'none'

# Versión inicial del proyecto.
# 0.1.0 = versión visible de desarrollo
# +1    = número interno de compilación
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: 18.0.0
  supabase_flutter: 2.17.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  http: ^1.6.0
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
